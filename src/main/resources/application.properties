server.address=127.0.0.1
server.port=${PORT:8081}
spring.application.name=ReleaseFlow
spring.datasource.url=${DB_URL:jdbc:h2:file:./testdb/releaseflow}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=never
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoints.access.max-permitted=read-only
management.info.env.enabled=true
info.app.name=ReleaseFlow
info.app.author=Egor Kubarev
info.app.version=1.0.0
logging.file.name=logs/releaseflow.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.level.org.springframework=WARN
spring.thymeleaf.cache=true
